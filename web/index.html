<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the page use the whole phone screen; the CSS keeps
       everything clear of the notch and the home bar. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>VIRULJA</title>
  <meta name="description" content="Zajednička putovanja: plan, troškovi i uspomene.">
  <meta name="theme-color" content="#E9E6DF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171914" media="(prefers-color-scheme: dark)">

  <!-- Installable app (Android, iPhone, iPad). -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="VIRULJA">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=Cormorant+Garamond:wght@600;700&family=Karla:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    // The look chosen in Postavke, before anything is drawn: without it the
    // first picture came in the phone's own look and turned a moment later.
    try {
      var look = localStorage.getItem('theme');
      if (look === 'light' || look === 'dark') document.documentElement.setAttribute('data-theme', look);
    } catch (e) {}
  </script>
  <script defer src="main.dart.js"></script>
</head>
<body>
  <div id="app"><noscript>VIRULJA treba JavaScript.</noscript></div>
  <div class="top-cover" aria-hidden="true"></div>
  <!-- VIRULJA on opening, in the page itself, so it is the very first picture:
       added by the app, it came only once the app had loaded, after an empty
       screen. main.dart takes it over; the app was only reloaded: no splash. -->
  <div class="splash" id="splash" aria-hidden="true"><div class="splash-word"><span>V</span><span style="animation-delay:256ms">I</span><span style="animation-delay:512ms">R</span><span style="animation-delay:768ms">U</span><span style="animation-delay:1024ms">L</span><span style="animation-delay:1280ms">J</span><span style="animation-delay:1536ms">A</span></div></div>
  <script>
    try {
      if (sessionStorage.getItem('opened')) document.getElementById('splash').remove();
    } catch (e) {}
  </script>
</body>
</html>
